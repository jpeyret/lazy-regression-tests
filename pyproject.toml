[project]
name = "lazy-regression-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "more-itertools>=11.1.0",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.3",
]

[dependency-groups]
data = [
  "polars>=1.43.2",
]
test = [
  "jinja2>=3.1.6",
  "pytest>=9.1.1",
]
web = [
  "beautifulsoup4>=4.15.0",
  "requests>=2.34.2",
]

[tool.basedpyright]
typeCheckingMode = "recommended"

reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I001"]

[tool.uv.sources]
bemyerp = { path = "../bemyerp", editable = true }
