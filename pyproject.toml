[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lazy-regression-tests"
version = "0.5.4"
description = "Regression testing utilities for comparing repeated outputs across runs."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "timeout-decorator>=0.5.0",
    "PyYAML>=6.0.3",
    "pydantic>=2.13.4",
    "more-itertools>=11.1.0",
]

[project.optional-dependencies]
web = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "responses>=0.26.2",
]

test = [
    "beautifulsoup4>=4.15.0",
    "jinja2>=3.1.6",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "responses>=0.26.2",
]

data = [
    "polars>=1.43.2",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lazy_regression_tests"]

[tool.pytest.ini_options]
testpaths = ["lazy_regression_tests/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I001"]

[dependency-groups]
database = [
    "sqlalchemy>=2.0.52",
    "sqlparse>=0.6.0",
]
django = [
    "django>=6.1",
]
test = [
    "responses>=0.26.2",
    "beautifulsoup4>=4.15.0",
    "jinja2>=3.1.6",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "lxml>=6.1.1",
]
web = [
    "lxml>=6.1.1",
]
