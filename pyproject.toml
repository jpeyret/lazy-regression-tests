[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lazy-regression-tests"
version = "0.5.4"
description = "Regression testing utilities for comparing repeated outputs across runs."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "soupsieve>=2.9.1",
    "timeout-decorator>=0.5.0",
    "typing-extensions>=4.16.0",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
web = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
]

test = [
    "beautifulsoup4>=4.15.0",
    "jinja2>=3.1.6",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

data = [
    "polars>=1.43.2",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lazy_regression_tests"]

[tool.pytest.ini_options]
testpaths = ["lazy_regression_tests/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I001"]
